name: OpenPOS CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Windows launcher and installer invariants
        run: node test/packaging.js
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-${{ matrix.os }}
          path: |
            logs
            shots
          if-no-files-found: ignore
  visual-retail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Real Chromium responsive suite
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenPOS-responsive-screenshots
          path: shots
          if-no-files-found: error
  windows-installer-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Static packaging contract
        run: node test/packaging.js
      - name: Portable hidden launcher files exist
        shell: powershell
        run: |
          if (-not (Test-Path .\start-pos.bat)) { throw 'start-pos.bat missing' }
          if (-not (Test-Path .\start-pos-hidden.vbs)) { throw 'start-pos-hidden.vbs missing' }
          node --check server.js
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build real Windows installer
        shell: powershell
        run: .\packaging\build-installer.ps1
      - name: Verify installer artifact
        shell: powershell
        run: |
          $installer = '.\packaging\output\OpenPOS-Setup.exe'
          if (-not (Test-Path $installer)) { throw 'Installer was not produced' }
          if ((Get-Item $installer).Length -lt 10MB) { throw 'Installer artifact is unexpectedly small' }
      - name: Install silently on a clean path
        shell: powershell
        run: |
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\OpenPOS-CI')
          $p = Start-Process '.\packaging\output\OpenPOS-Setup.exe' -ArgumentList $args -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }
      - name: Exercise installed application
        shell: powershell
        run: .\packaging\test-installed.ps1 -InstallDir 'C:\OpenPOS-CI'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPOS-Windows-installer
          path: packaging/output/OpenPOS-Setup.exe
