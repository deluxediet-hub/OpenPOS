<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deni statement</title>
<style>
  /* A statement is a document, not a screen: it must look right on paper and
     still be readable on the phone the customer is holding. */
  :root { --brand: #0a6b3a; --ink: #0d1a13; --muted: #62736a; --line: #e2eae5; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font: 14px/1.55 "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); margin: 0;
    background: radial-gradient(900px 400px at 90% -10%, #eef6f1, transparent), #f4f7f5;
  }
  .page {
    max-width: 760px; margin: 22px auto; background: #fff; padding: 34px;
    border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 34px -18px rgba(9, 32, 20, .35);
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 16px; }
  .biz { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
  .biz small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 2px; }
  h1 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 26px; margin: 14px 0 20px; font-size: 13px; }
  .grid b { color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); border-bottom: 1px solid #c9d6cd; padding: 8px; }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:hover { background: #f8faf9; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.credit td { color: #a45c07; }
  tr.repay td { color: #15803d; }
  .tot { display: flex; gap: 14px; margin-top: 18px; font-size: 12.5px; flex-wrap: wrap; }
  .tot div { flex: 1 1 150px; border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; background: #fbfdfc; }
  .tot b { display: block; font-size: 18px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .foot { margin-top: 24px; padding-top: 12px; border-top: 1px dashed #cbd5e1; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .btnbar { max-width: 760px; margin: 0 auto; padding: 16px 16px 0; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px;
    border: 1px solid var(--brand); background: var(--brand); color: #fff; border-radius: 10px;
    padding: 9px 18px; font-weight: 650; font-size: 14px; cursor: pointer; font-family: inherit;
    box-shadow: 0 1px 2px rgba(9, 32, 20, .1);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: #fff; color: var(--brand); }
  @media (max-width: 640px) {
    .page { margin: 10px; padding: 20px; border-radius: 14px; }
    .grid { grid-template-columns: 1fr; }
    .top { flex-direction: column; }
  }
  @media print {
    body { background: #fff; }
    .page { box-shadow: none; border: none; margin: 0; max-width: none; padding: 0; border-radius: 0; }
    .btnbar { display: none; }
    table { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="btnbar">
  <button class="btn ghost" onclick="location.href='/'">← Back</button>
  <button class="btn" onclick="window.print()">Print</button>
  <button class="btn" id="pdf" disabled>PDF</button>
</div>
<div class="page" id="doc">
  <div class="top">
    <div class="biz" id="biz">…</div>
    <h1>Deni statement</h1>
  </div>
  <div class="grid" id="meta"></div>
  <table>
    <thead><tr><th>Date</th><th>Type</th><th>Note / ref</th><th class="num">Amount</th><th class="num">Balance</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="tot" id="tot"></div>
  <div class="foot">
    <span id="printed"></span>
    <span>OpenPOS — this statement is generated from the customer ledger and reconciles to the shilling.</span>
  </div>
</div>
<script src="/assets/pdf.js"></script>
<script>
let STMT = null;
const fmt = (n) => `Ksh ${Number(n || 0).toLocaleString('en-KE')}`;
const dt = (s) => new Date(s).toLocaleString('en-KE', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const esc = (x) => String(x ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const q = new URLSearchParams(location.search);
const id = q.get('id');
(async () => {
  if (!id) { document.getElementById('doc').innerHTML = '<p>Missing <code>?id=</code>.</p>'; return; }
  let s;
  try {
    const r = await fetch(`/api/customers/${id}/statement?${q.get('from') ? 'from=' + encodeURIComponent(q.get('from')) : ''}${q.get('to') ? '&to=' + encodeURIComponent(q.get('to')) : ''}`, { credentials: 'same-origin' });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    s = await r.json();
  } catch (e) { document.getElementById('doc').innerHTML = `<p>${esc(e.message)}</p>`; return; }
  const b = s.business || {};
  document.getElementById('biz').innerHTML = `${esc(b.name || 'OpenPOS')}<small>${esc(b.phone || '')}${b.kraPin ? ' · KRA PIN ' + esc(b.kraPin) : ''}${b.address ? '<br>' + esc(b.address) : ''}</small>`;
  document.getElementById('meta').innerHTML = `
    <div><b>Customer</b><br>${esc(s.customer.name)}${s.customer.phone ? ' · ' + esc(s.customer.phone) : ''}</div>
    <div><b>Period</b><br>${s.from || 'beginning'} → ${s.to ? dt(s.to) : 'today'}</div>
    <div><b>Credit limit</b><br>${fmt(s.customer.credit_limit)}</div>
    <div><b>Store credit</b><br>${fmt(s.customer.store_credit)}</div>`;
  const rows = document.getElementById('rows');
  if (s.opening !== 0) {
    rows.innerHTML += `<tr><td>${esc(s.from ? dt(s.from) : 'before period')}</td><td>Opening balance</td><td></td><td></td><td class="num">${fmt(s.opening)}</td></tr>`;
  }
  rows.innerHTML += s.rows.map((r) => `
    <tr class="${r.type === 'credit_sale' ? 'credit' : 'repay'}">
      <td>${dt(r.date)}</td>
      <td>${r.type === 'credit_sale' ? 'Credit sale' : 'Repayment'}</td>
      <td>${esc(r.note || r.ref || '')}</td>
      <td class="num">${r.type === 'credit_sale' ? '+' : '−'}${fmt(r.amount)}</td>
      <td class="num">${fmt(r.balance)}</td>
    </tr>`).join('') || '<tr><td colspan="5">No movements in this period.</td></tr>';
  document.getElementById('tot').innerHTML = `
    <div>Credit sales<b>${fmt(s.totals.credit_sales)}</b></div>
    <div>Repayments<b>${fmt(s.totals.repayments)}</b></div>
    <div>Closing balance<b>${fmt(s.closing)}</b></div>`;
  document.getElementById('printed').textContent = `Printed ${new Date().toLocaleString('en-KE')}`;
  document.title = `Statement — ${s.customer.name}`;
  STMT = s;
  const pdfBtn = document.getElementById('pdf');
  if (pdfBtn) { pdfBtn.disabled = false; pdfBtn.onclick = statementPdf; }
})();

// The same statement as a file the shop can send to the customer — drawn here,
// so it works with no internet.
function statementPdf() {
  if (!STMT || !window.OpenPosPdf) return;
  const b = STMT.business || {};
  const d = OpenPosPdf.doc({ title: `Statement — ${STMT.customer.name}` });
  d.heading('Deni statement', b.name || 'OpenPOS');
  d.meta([
    ['Customer', `${STMT.customer.name}${STMT.customer.phone ? ' · ' + STMT.customer.phone : ''}`],
    ['Period', `${STMT.from || 'beginning'} to ${STMT.to ? dt(STMT.to) : 'today'}`],
    ['Credit limit', fmt(STMT.customer.credit_limit)],
    ['Closing balance', fmt(STMT.closing)],
    ['Printed', new Date().toLocaleString('en-KE')]
  ]);
  const rows = [];
  if (STMT.opening !== 0) rows.push([STMT.from ? dt(STMT.from) : 'before period', 'Opening balance', '', '', fmt(STMT.opening)]);
  for (const r of STMT.rows) {
    rows.push([dt(r.date), r.type === 'credit_sale' ? 'Credit sale' : 'Repayment', r.note || r.ref || '',
      (r.type === 'credit_sale' ? '+' : '-') + fmt(r.amount), fmt(r.balance)]);
  }
  d.table([
    { title: 'Date' }, { title: 'Type' }, { title: 'Note / ref' },
    { title: 'Amount', align: 'right' }, { title: 'Balance', align: 'right' }
  ], rows, {
    totals: ['Totals', '', `Credit ${fmt(STMT.totals.credit_sales)} · Repaid ${fmt(STMT.totals.repayments)}`, '', fmt(STMT.closing)]
  });
  const name = `statement-${(STMT.customer.name || 'customer').toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${new Date().toISOString().slice(0, 10)}.pdf`;
  OpenPosPdf.save(d.build(), name);
}
</script>
</body>
</html>
