<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager · OpenPOS v2</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="topbar">
  <span class="brand">OpenPOS v2</span>
  <span class="biz" id="m-biz"></span>
  <span class="spacer"></span>
  <a href="/" class="small" style="color:#fff">← <span data-i18n="today">Today</span></a>
  <button class="lang-toggle" id="m-lang">SW</button>
</div>
<div class="wrap">
  <div id="m-restricted" class="card hidden" style="text-align:center;padding:60px">
    <h2>Manager access required</h2>
    <p class="muted">This area is for owner and manager accounts.</p>
  </div>

  <div id="m-main" class="hidden">
    <div class="tabbar" id="tabs">
      <button data-tab="products" data-i18n="products">Products</button>
      <button data-tab="categories" data-i18n="categories">Categories</button>
      <button data-tab="branches" data-i18n="branches">Branches</button>
      <button data-tab="staff" data-i18n="staff">Staff</button>
      <button data-tab="settings" data-i18n="settings">Settings</button>
      <button data-tab="audit" data-i18n="audit">Audit log</button>
    </div>

    <!-- ============ PRODUCTS ============ -->
    <section id="tab-products" class="hidden">
      <div class="row" style="margin-bottom:10px">
        <input id="p-search" style="max-width:320px" data-i18n-placeholder="search" placeholder="Search…">
        <span class="muted small" id="p-count"></span>
      </div>
      <div class="card" style="margin-bottom:14px;overflow:auto">
        <table><thead><tr>
          <th data-i18n="name">Name</th><th data-i18n="category">Category</th>
          <th data-i18n="barcode">Barcode</th><th data-i18n="price">Price</th>
          <th data-i18n="cost">Cost</th><th data-i18n="tax_type">Tax</th>
          <th>Stock</th><th></th><th></th>
        </tr></thead><tbody id="p-rows"></tbody></table>
      </div>
      <div class="card">
        <h3 id="p-form-title" data-i18n="add">Add</h3>
        <input type="hidden" id="p-id">
        <div class="grid cols-3">
          <label class="f" style="grid-column:span 2"><span data-i18n="name">Name</span><input id="p-name"></label>
          <label class="f"><span data-i18n="name">Name (SW)</span><input id="p-namesw"></label>
          <label class="f"><span data-i18n="category">Category</span><select id="p-cat"></select></label>
          <label class="f"><span data-i18n="barcode">Barcode</span><input id="p-barcode"></label>
          <label class="f"><span data-i18n="unit">Unit</span><input id="p-unit" value="pcs"></label>
          <label class="f"><span data-i18n="cost">Cost (Ksh)</span><input id="p-cost" type="number" min="0" value="0"></label>
          <label class="f"><span data-i18n="price">Price (Ksh, VAT incl.)</span><input id="p-price" type="number" min="1"></label>
          <label class="f"><span>Wholesale price</span><input id="p-wholesale" type="number" min="0" value="0"></label>
          <label class="f"><span data-i18n="tax_type">Tax type</span>
            <select id="p-tax"><option value="std">VAT 16%</option><option value="zero">VAT 0%</option><option value="exempt">Exempt</option></select></label>
          <label class="f"><span data-i18n="kra_code">KRA item code</span><input id="p-kra" class="mono"></label>
          <label class="f"><span>Min age</span><input id="p-age" type="number" min="0" placeholder="—" value=""></label>
          <label class="f"><span>Brand</span><input id="p-brand"></label>
          <label class="f"><span>Pack size (e.g. 6 per case)</span><input id="p-packsz" type="number" min="1" value="1"></label>
          <label class="f"><span>Pack name</span><input id="p-packname" placeholder="case, 6× …"></label>
        </div>
        <div class="row wrap">
          <label class="check"><input type="checkbox" id="p-rx"> Requires prescription</label>
          <label class="check"><input type="checkbox" id="p-controlled"> Controlled drug</label>
          <label class="check"><input type="checkbox" id="p-batches"> Track batches/expiry</label>
          <label class="check"><input type="checkbox" id="p-openprice"> Open price (weigh at till)</label>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="p-save" data-i18n="save">Save</button>
          <button class="btn ghost hidden" id="p-clear" data-i18n="cancel">Cancel</button>
          <div class="msg" id="p-msg" style="margin:0"></div>
        </div>
      </div>
    </section>

    <!-- ============ CATEGORIES ============ -->
    <section id="tab-categories" class="hidden">
      <div class="card" style="margin-bottom:14px">
        <table><thead><tr>
          <th data-i18n="name">Name</th><th>Name (SW)</th><th>Flags</th><th></th>
        </tr></thead><tbody id="c-rows"></tbody></table>
      </div>
      <div class="card">
        <h3 id="c-form-title" data-i18n="add">Add</h3>
        <input type="hidden" id="c-id">
        <div class="grid cols-3">
          <label class="f"><span data-i18n="name">Name</span><input id="c-name"></label>
          <label class="f"><span>Name (SW)</span><input id="c-namesw"></label>
          <div class="row" style="align-items:end">
            <label class="check"><input type="checkbox" id="c-age"> Age restricted</label>
            <label class="check"><input type="checkbox" id="c-rx"> Requires Rx</label>
          </div>
        </div>
        <div class="row">
          <button class="btn" id="c-save" data-i18n="save">Save</button>
          <button class="btn ghost hidden" id="c-clear" data-i18n="cancel">Cancel</button>
          <div class="msg" id="c-msg" style="margin:0"></div>
        </div>
      </div>
    </section>

    <!-- ============ BRANCHES ============ -->
    <section id="tab-branches" class="hidden">
      <div class="card" style="margin-bottom:14px">
        <table><thead><tr>
          <th>Code</th><th data-i18n="name">Name</th><th data-i18n="address">Address</th>
          <th>VAT</th><th>Default</th><th data-i18n="today">Today</th><th></th>
        </tr></thead><tbody id="b-rows"></tbody></table>
      </div>
      <div class="card">
        <h3 id="b-form-title" data-i18n="add">Add</h3>
        <input type="hidden" id="b-id">
        <div class="grid cols-3">
          <label class="f"><span data-i18n="name">Name</span><input id="b-name"></label>
          <label class="f"><span data-i18n="address">Address</span><input id="b-address"></label>
          <label class="f"><span data-i18n="phone">Phone</span><input id="b-phone"></label>
          <label class="f"><span data-i18n="kra_pin">KRA PIN</span><input id="b-kra"></label>
          <label class="check" style="align-self:end"><input type="checkbox" id="b-vat"> VAT registered</label>
          <label class="check" style="align-self:end"><input type="checkbox" id="b-def"> Make default</label>
        </div>
        <div class="row">
          <button class="btn" id="b-save" data-i18n="save">Save</button>
          <button class="btn ghost hidden" id="b-clear" data-i18n="cancel">Cancel</button>
          <div class="msg" id="b-msg" style="margin:0"></div>
        </div>
      </div>
    </section>

    <!-- ============ STAFF ============ -->
    <section id="tab-staff" class="hidden">
      <div class="card" style="margin-bottom:14px">
        <table><thead><tr>
          <th data-i18n="name">Name</th><th data-i18n="role">Role</th>
          <th data-i18n="branches">Branch</th><th>Last login</th><th data-i18n="active">Active</th>
        </tr></thead><tbody id="s-rows"></tbody></table>
      </div>
      <div class="card">
        <h3 id="s-form-title" data-i18n="add">Add</h3>
        <input type="hidden" id="s-id">
        <div class="grid cols-3">
          <label class="f"><span data-i18n="name">Name</span><input id="s-name"></label>
          <label class="f"><span data-i18n="role">Role</span>
            <select id="s-role"><option value="cashier" data-i18n="cashier">Cashier</option>
            <option value="manager" data-i18n="manager">Manager</option>
            <option value="staff" data-i18n="staff_r">Staff</option>
            <option value="owner" data-i18n="owner">Owner</option></select></label>
          <label class="f"><span data-i18n="branches">Branch</span><select id="s-branch"></select></label>
          <label class="f"><span data-i18n="pin">PIN (4–8 digits, blank = keep)</span><input id="s-pin" inputmode="numeric" autocomplete="off"></label>
          <label class="check" style="align-self:end"><input type="checkbox" id="s-active" checked> <span data-i18n="active">Active</span></label>
        </div>
        <div class="row">
          <button class="btn" id="s-save" data-i18n="save">Save</button>
          <button class="btn ghost hidden" id="s-clear" data-i18n="cancel">Cancel</button>
          <div class="msg" id="s-msg" style="margin:0"></div>
        </div>
      </div>
    </section>

    <!-- ============ SETTINGS ============ -->
    <section id="tab-settings" class="hidden">
      <div class="card">
        <h3 data-i18n="settings">Settings</h3>
        <div class="grid cols-2">
          <label class="f"><span data-i18n="business_name">Business name</span><input id="st-name"></label>
          <label class="f"><span data-i18n="phone">Phone</span><input id="st-phone"></label>
          <label class="f"><span data-i18n="address">Address</span><input id="st-address"></label>
          <label class="f"><span data-i18n="kra_pin">KRA PIN</span><input id="st-kra"></label>
          <label class="f"><span data-i18n="vat_rate">VAT rate %</span><input id="st-vatrate" type="number" min="0" max="30"></label>
          <label class="f"><span data-i18n="receipt_footer">Receipt footer</span><input id="st-footer"></label>
          <label class="check"><input type="checkbox" id="st-vatreg"> <span data-i18n="vat_registered">VAT registered</span></label>
        </div>
        <div class="row"><button class="btn" id="st-save" data-i18n="save">Save</button>
          <div class="msg" id="st-msg" style="margin:0"></div></div>
      </div>
    </section>

    <!-- ============ AUDIT ============ -->
    <section id="tab-audit" class="hidden">
      <div class="card">
        <div class="row" style="margin-bottom:10px">
          <h3 style="margin:0" data-i18n="audit">Audit log</h3>
          <span class="spacer"></span>
          <button class="btn small" id="a-verify">Verify chain</button>
          <div class="msg" id="a-msg" style="margin:0"></div>
        </div>
        <div style="overflow:auto">
        <table><thead><tr><th>When</th><th>User</th><th>Action</th><th>Entity</th><th>Detail</th></tr></thead>
        <tbody id="a-rows"></tbody></table></div>
      </div>
    </section>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
const { t, setLang, api, fmt, esc, toast } = OP;
const $ = (s) => document.querySelector(s);

let ME = null, CATEGORIES = [], BRANCHES = [];

function roleKey(r) { return r === 'staff' ? 'staff_r' : r; }
function pills(p) {
  const out = [];
  if (p.age_min) out.push(`<span class="pill r">${p.age_min}+</span>`);
  if (p.requires_rx) out.push('<span class="pill">Rx</span>');
  if (p.is_controlled) out.push('<span class="pill r">Ctl</span>');
  if (p.track_batches) out.push('<span class="pill">Batch</span>');
  if (p.open_priced) out.push('<span class="pill">Open</span>');
  return out.join(' ');
}

async function boot() {
  OP.setLang(OP.lang());
  try {
    ME = await api('/api/me', { noRedirect: true });
  } catch { location.href = '/'; return; }
  if (ME.user.role !== 'owner' && ME.user.role !== 'manager') {
    $('#m-restricted').classList.remove('hidden');
    return;
  }
  $('#m-main').classList.remove('hidden');
  const boot = await api('/api/bootstrap').catch(() => null);
  const biz = boot && boot.settings && boot.settings.business || {};
  $('#m-biz').textContent = `${biz.name || ''} — ${ME.user.name} (${t(roleKey(ME.user.role))})`;
  CATEGORIES = (await api('/api/categories')).catch(() => []);
  BRANCHES = (await api('/api/branches')).catch(() => []);
  fillCatSelects();
  await loadAll();
  selectTab(location.hash.replace('#', '') || 'products');
  $('#m-lang').onclick = () => {
    OP.setLang(OP.lang() === 'en' ? 'sw' : 'en');
    $('#m-lang').textContent = OP.lang() === 'en' ? 'SW' : 'EN';
    loadAll();
  };
}

function selectTab(name) {
  const tabs = ['products', 'categories', 'branches', 'staff', 'settings', 'audit'];
  if (!tabs.includes(name)) name = 'products';
  document.querySelectorAll('#tabs button').forEach((b) =>
    b.classList.toggle('on', b.dataset.tab === name));
  tabs.forEach((tb) => $(`#tab-${tb}`).classList.toggle('hidden', tb !== name));
  if (name === 'settings') loadSettings();
  if (name === 'audit') loadAudit();
}

async function loadAll() {
  await Promise.all([loadProducts(), loadCategories(), loadBranches(), loadStaff()]);
}

// ---------- products ----------
async function loadProducts() {
  const rows = await api('/api/products');
  const catName = Object.fromEntries(CATEGORIES.map((c) => [c.id, c.name]));
  const q = ($('#p-search').value || '').toLowerCase();
  const filtered = rows.filter((p) => !q || p.name.toLowerCase().includes(q) || (p.barcode || '').includes(q));
  $('#p-count').textContent = `${filtered.length} / ${rows.length}`;
  $('#p-rows').innerHTML = filtered.map((p) => `
    <tr class="clickable" data-id="${p.id}">
      <td>${esc(p.name)} ${pills(p)}</td>
      <td>${esc(catName[p.category_id] || '')}</td>
      <td class="mono small">${esc(p.barcode || '')}</td>
      <td>${fmt(p.price)}</td><td>${fmt(p.cost)}</td>
      <td><span class="pill ${p.tax_type === 'std' ? 'g' : ''}">${p.tax_type}</span></td>
      <td>${p.active ? fmt(p.stock_qty ?? '—') : '<span class="muted">off</span>'}</td>
      <td><button class="btn small" data-act="edit" data-id="${p.id}">✎</button></td>
      <td><button class="btn danger" data-act="del" data-id="${p.id}" data-name="${esc(p.name)}">✕</button></td>
    </tr>`).join('') || `<tr><td colspan="9" class="muted">${t('no_rows')}</td></tr>`;
  $('#p-search').oninput = loadProducts;
  document.querySelectorAll('#p-rows [data-act]').forEach((b) => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const id = Number(b.dataset.id);
      if (b.dataset.act === 'del') {
        if (!confirm(`Delete "${b.dataset.name}"?`)) return;
        try {
          await api(`/api/products/${id}`, { method: 'DELETE' });
          toast($('#p-msg'), t('delete') + ' ✓', true);
          loadProducts();
        } catch (err) { toast($('#p-msg'), err.message, false); }
      } else {
        const p = rows.find((r) => r.id === id);
        if (!p) return;
        $('#p-id').value = p.id;
        $('#p-name').value = p.name; $('#p-namesw').value = p.name_sw || '';
        $('#p-cat').value = p.category_id || '';
        $('#p-barcode').value = p.barcode || ''; $('#p-unit').value = p.unit;
        $('#p-cost').value = p.cost; $('#p-price').value = p.price;
        $('#p-wholesale').value = p.wholesale_price || 0;
        $('#p-tax').value = p.tax_type; $('#p-kra').value = p.kra_item_code || '';
        $('#p-age').value = p.age_min || ''; $('#p-brand').value = p.brand || '';
        $('#p-packsz').value = p.pack_size || 1; $('#p-packname').value = p.pack_name || '';
        $('#p-rx').checked = !!p.requires_rx; $('#p-controlled').checked = !!p.is_controlled;
        $('#p-batches').checked = !!p.track_batches; $('#p-openprice').checked = !!p.open_priced;
        $('#p-form-title').textContent = t('save');
        $('#p-clear').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };
  });
}

function resetProductForm() {
  $('#p-id').value = '';
  ['p-name','p-namesw','p-barcode','p-cost','p-price','p-wholesale','p-kra','p-age','p-brand','p-packname']
    .forEach((id) => $(`#${id}`).value = '');
  $('#p-cat').value = ''; $('#p-unit').value = 'pcs'; $('#p-tax').value = 'std';
  $('#p-packsz').value = 1;
  ['#p-rx', '#p-controlled', '#p-batches', '#p-openprice'].forEach((id) => $(id).checked = false);
  $('#p-form-title').textContent = t('add');
  $('#p-clear').classList.add('hidden');
}

$('#p-clear').onclick = resetProductForm;
$('#p-save').onclick = async () => {
  const id = $('#p-id').value;
  const body = {
    name: $('#p-name').value, name_sw: $('#p-namesw').value,
    category_id: $('#p-cat').value ? Number($('#p-cat').value) : null,
    barcode: $('#p-barcode').value, unit: $('#p-unit').value,
    cost: Number($('#p-cost').value) || 0, price: Number($('#p-price').value) || 0,
    wholesale_price: Number($('#p-wholesale').value) || 0,
    tax_type: $('#p-tax').value, kra_item_code: $('#p-kra').value,
    age_min: $('#p-age').value ? Number($('#p-age').value) : null,
    brand: $('#p-brand').value,
    pack_size: Number($('#p-packsz').value) || 1, pack_name: $('#p-packname').value,
    requires_rx: $('#p-rx').checked ? 1 : 0, is_controlled: $('#p-controlled').checked ? 1 : 0,
    track_batches: $('#p-batches').checked ? 1 : 0, open_priced: $('#p-openprice').checked ? 1 : 0
  };
  try {
    if (id) await api(`/api/products/${id}`, { method: 'PUT', body });
    else await api('/api/products', { method: 'POST', body });
    toast($('#p-msg'), t('save_ok'), true);
    resetProductForm();
    loadProducts();
  } catch (e) { toast($('#p-msg'), e.message, false); }
};

// ---------- categories ----------
async function loadCategories() {
  const rows = await api('/api/categories');
  CATEGORIES = rows;
  fillCatSelects();
  $('#c-rows').innerHTML = rows.map((c) => `
    <tr class="clickable" data-id="${c.id}">
      <td>${esc(c.name)}</td><td>${esc(c.name_sw || '')}</td>
      <td>${c.age_restricted ? '<span class="pill r">Age</span> ' : ''}${c.requires_rx ? '<span class="pill">Rx</span>' : ''}</td>
      <td><button class="btn danger" data-del="${c.id}" data-name="${esc(c.name)}">✕</button></td>
    </tr>`).join('') || `<tr><td colspan="4" class="muted">${t('no_rows')}</td></tr>`;
  document.querySelectorAll('#c-rows tr[data-id]').forEach((tr) => {
    tr.onclick = () => {
      const c = rows.find((r) => r.id === Number(tr.dataset.id));
      if (!c) return;
      $('#c-id').value = c.id; $('#c-name').value = c.name; $('#c-namesw').value = c.name_sw || '';
      $('#c-age').checked = !!c.age_restricted; $('#c-rx').checked = !!c.requires_rx;
      $('#c-form-title').textContent = t('save');
      $('#c-clear').classList.remove('hidden');
    };
  });
  document.querySelectorAll('#c-rows [data-del]').forEach((b) => {
    b.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm(`Delete "${b.dataset.name}"?`)) return;
      try {
        await api(`/api/categories/${b.dataset.del}`, { method: 'DELETE' });
        loadCategories();
      } catch (err) { toast($('#c-msg'), err.message, false); }
    };
  });
}

$('#c-clear').onclick = () => {
  $('#c-id').value = ''; $('#c-name').value = ''; $('#c-namesw').value = '';
  $('#c-age').checked = false; $('#c-rx').checked = false;
  $('#c-form-title').textContent = t('add');
  $('#c-clear').classList.add('hidden');
};

$('#c-save').onclick = async () => {
  const id = $('#c-id').value;
  const body = {
    name: $('#c-name').value, name_sw: $('#c-namesw').value,
    ageRestricted: $('#c-age').checked, requiresRx: $('#c-rx').checked
  };
  try {
    if (id) await api(`/api/categories/${id}`, { method: 'PUT', body });
    else await api('/api/categories', { method: 'POST', body });
    toast($('#c-msg'), t('save_ok'), true);
    $('#c-clear').onclick();
    loadCategories();
  } catch (e) { toast($('#c-msg'), e.message, false); }
};

// ---------- branches ----------
async function loadBranches() {
  const rows = await api('/api/branches');
  BRANCHES = rows;
  fillBranchSelects();
  $('#b-rows').innerHTML = rows.map((b) => `
    <tr class="clickable" data-id="${b.id}">
      <td class="mono">${esc(b.code)}</td><td>${esc(b.name)}</td><td>${esc(b.address || '')}</td>
      <td>${b.vat_registered ? '<span class="pill g">VAT</span>' : '—'}</td>
      <td>${b.is_default ? '<span class="pill g">default</span>' : ''}</td>
      <td>${fmt(b.salesToday.t)}</td>
      <td>${b.is_default ? '' : `<button class="btn danger" data-del="${b.id}" data-name="${esc(b.name)}">✕</button>`}</td>
    </tr>`).join('');
  document.querySelectorAll('#b-rows tr[data-id]').forEach((tr) => {
    tr.onclick = () => {
      const b = rows.find((r) => r.id === Number(tr.dataset.id));
      if (!b) return;
      $('#b-id').value = b.id; $('#b-name').value = b.name; $('#b-address').value = b.address || '';
      $('#b-phone').value = b.phone || ''; $('#b-kra').value = b.kra_pin || '';
      $('#b-vat').checked = !!b.vat_registered; $('#b-def').checked = !!b.is_default;
      $('#b-form-title').textContent = t('save');
      $('#b-clear').classList.remove('hidden');
    };
  });
  document.querySelectorAll('#b-rows [data-del]').forEach((b) => {
    b.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm(`Delete branch "${b.dataset.name}"?`)) return;
      try {
        await api(`/api/branches/${b.dataset.del}`, { method: 'DELETE' });
        loadBranches();
      } catch (err) { toast($('#b-msg'), err.message, false); }
    };
  });
}

$('#b-clear').onclick = () => {
  $('#b-id').value = '';
  ['b-name', 'b-address', 'b-phone', 'b-kra'].forEach((id) => $(`#${id}`).value = '');
  $('#b-vat').checked = false; $('#b-def').checked = false;
  $('#b-form-title').textContent = t('add');
  $('#b-clear').classList.add('hidden');
};

$('#b-save').onclick = async () => {
  const id = $('#b-id').value;
  const body = {
    name: $('#b-name').value, address: $('#b-address').value, phone: $('#b-phone').value,
    kraPin: $('#b-kra').value, vatRegistered: $('#b-vat').checked, isDefault: $('#b-def').checked
  };
  try {
    if (id) await api(`/api/branches/${id}`, { method: 'PUT', body });
    else await api('/api/branches', { method: 'POST', body });
    toast($('#b-msg'), t('save_ok'), true);
    $('#b-clear').onclick();
    loadBranches();
  } catch (e) { toast($('#b-msg'), e.message, false); }
};

// ---------- staff ----------
async function loadStaff() {
  const rows = await api('/api/staff');
  const brName = Object.fromEntries(BRANCHES.map((b) => [b.id, b.name]));
  $('#s-rows').innerHTML = rows.map((s) => `
    <tr class="clickable" data-id="${s.id}">
      <td>${esc(s.name)}</td><td><span class="pill ${s.role === 'owner' ? 'g' : ''}">${t(roleKey(s.role))}</span></td>
      <td>${s.branch_id ? esc(brName[s.branch_id] || s.branch_name || '') : t('all_branches')}</td>
      <td class="muted small">${s.last_login_at ? new Date(s.last_login_at).toLocaleString() : '—'}</td>
      <td>${s.active ? '<span class="pill g">✓</span>' : '<span class="pill r">off</span>'}</td>
    </tr>`).join('');
  document.querySelectorAll('#s-rows tr[data-id]').forEach((tr) => {
    tr.onclick = () => {
      const s = rows.find((r) => r.id === Number(tr.dataset.id));
      if (!s) return;
      $('#s-id').value = s.id; $('#s-name').value = s.name; $('#s-role').value = s.role;
      $('#s-branch').value = s.branch_id || '';
      $('#s-pin').value = ''; $('#s-active').checked = !!s.active;
      $('#s-form-title').textContent = t('save');
      $('#s-clear').classList.remove('hidden');
    };
  });
}

$('#s-clear').onclick = () => {
  $('#s-id').value = ''; $('#s-name').value = ''; $('#s-pin').value = '';
  $('#s-role').value = 'cashier'; $('#s-branch').value = ''; $('#s-active').checked = true;
  $('#s-form-title').textContent = t('add');
  $('#s-clear').classList.add('hidden');
};

$('#s-save').onclick = async () => {
  const id = $('#s-id').value;
  const body = {
    name: $('#s-name').value, role: $('#s-role').value,
    branch_id: $('#s-branch').value ? Number($('#s-branch').value) : null,
    active: $('#s-active').checked
  };
  const pin = $('#s-pin').value.trim();
  if (pin) body.pin = pin;
  try {
    if (id) await api(`/api/staff/${id}`, { method: 'PUT', body });
    else await api('/api/staff', { method: 'POST', body });
    toast($('#s-msg'), t('save_ok'), true);
    $('#s-clear').onclick();
    loadStaff();
  } catch (e) { toast($('#s-msg'), e.message, false); }
};

// ---------- settings ----------
async function loadSettings() {
  const s = await api('/api/settings');
  const b = s.business || {}, tx = s.tax || {};
  $('#st-name').value = b.name || ''; $('#st-phone').value = b.phone || '';
  $('#st-address').value = b.address || ''; $('#st-kra').value = b.kraPin || '';
  $('#st-vatrate').value = tx.vatRate ?? 16; $('#st-footer').value = b.receiptFooter || '';
  $('#st-vatreg').checked = !!b.vatRegistered;
}

$('#st-save').onclick = async () => {
  try {
    await api('/api/settings', {
      method: 'PUT',
      body: {
        business: {
          name: $('#st-name').value, phone: $('#st-phone').value,
          address: $('#st-address').value, kraPin: $('#st-kra').value,
          vatRegistered: $('#st-vatreg').checked, receiptFooter: $('#st-footer').value
        },
        tax: { vatRate: Number($('#st-vatrate').value) || 16 }
      }
    });
    toast($('#st-msg'), t('save_ok'), true);
  } catch (e) { toast($('#st-msg'), e.message, false); }
};

// ---------- audit ----------
async function loadAudit() {
  const rows = await api('/api/audit?limit=300');
  $('#a-rows').innerHTML = rows.map((a) => `
    <tr><td class="mono small muted">${new Date(a.ts).toLocaleString()}</td>
    <td>${esc(a.userName)}</td><td class="mono small">${esc(a.action)}</td>
    <td class="small">${esc(a.entity)}${a.entity_id ? ' #' + esc(a.entity_id) : ''}</td>
    <td class="small muted">${esc(JSON.stringify(a.detail).slice(0, 100))}</td></tr>`).join('')
    || `<tr><td colspan="5" class="muted">${t('no_rows')}</td></tr>`;
}

$('#a-verify').onclick = async () => {
  const el = $('#a-msg');
  el.textContent = '…'; el.className = 'msg';
  try {
    const r = await api('/api/audit/verify');
    if (r.ok) toast(el, `Chain verified — ${r.length} entries intact ✓`, true);
    else toast(el, `Chain broken at entry ${r.at}`, false);
  } catch (e) { toast(el, e.message, false); }
};

// ---------- shared selects ----------
function fillCatSelects() {
  const opts = `<option value="">—</option>` + CATEGORIES.map((c) =>
    `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#p-cat').innerHTML = opts;
}
function fillBranchSelects() {
  $('#s-branch').innerHTML = `<option value="">${t('all_branches')}</option>` + BRANCHES
    .map((b) => `<option value="${b.id}">${esc(b.name)}</option>`).join('');
}

document.querySelectorAll('#tabs button').forEach((b) => {
  b.onclick = () => { selectTab(b.dataset.tab); location.hash = b.dataset.tab; };
});
window.addEventListener('hashchange', () => selectTab(location.hash.replace('#', '')));

boot();
</script>
</body>
</html>
