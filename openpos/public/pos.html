<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Till · OpenPOS v2</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  body { overflow: hidden; }
  .pos-body { display: grid; grid-template-columns: 1fr 400px; gap: 14px; height: calc(100vh - 52px); padding: 14px; }
  .pos-left, .pos-right { display: flex; flex-direction: column; min-height: 0; }
  #scanbar { position: relative; margin-bottom: 10px; }
  #scan { padding: 14px 14px 14px 40px; font-size: 17px; border-radius: 10px; }
  #scanbar .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 18px; opacity: .55; }
  #cats { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px; }
  #cats button { border: 1px solid var(--line); background: #fff; border-radius: 18px; padding: 6px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  #cats button.on { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
  #grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-content: start; padding: 2px; }
  .prod { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; box-shadow: var(--shadow); text-align: left; font: inherit; }
  .prod:hover { border-color: var(--green); transform: translateY(-1px); }
  .prod .nm { font-weight: 600; font-size: 14px; min-height: 34px; }
  .prod .pr { font-size: 16px; font-weight: 700; color: var(--green-dark); margin-top: 6px; }
  .prod .st { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .prod .st.low { color: var(--red); font-weight: 600; }
  .pos-right { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; }
  .cust-row { display: flex; gap: 8px; margin-bottom: 8px; }
  #cart { flex: 1; overflow-y: auto; min-height: 60px; }
  .cline { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .cline .nm { font-size: 14px; font-weight: 600; }
  .cline .sub { font-size: 12px; color: var(--muted); }
  .cline .tot { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .qty { display: flex; align-items: center; gap: 4px; }
  .qty button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 15px; }
  .qty input { width: 48px; text-align: center; padding: 4px; }
  .tots { border-top: 2px solid var(--line); margin-top: 8px; padding-top: 8px; font-size: 14px; }
  .tots .r { display: flex; justify-content: space-between; margin: 3px 0; }
  .tots .big { font-size: 19px; font-weight: 700; }
  .paytabs { display: flex; gap: 6px; margin: 10px 0 8px; }
  .paytabs button { flex: 1; padding: 8px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .paytabs button.on { background: var(--green-soft); border-color: var(--green); color: var(--green-dark); }
  .quick { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .quick button { border: 1px dashed var(--line); background: #fff; border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  .act-row { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 8px; margin-top: 10px; }
  .followup { margin-top: 10px; padding: 10px; border: 1px dashed #94a3b8; border-radius: 8px; background: #f8fafc; }
  .followup .row { gap: 6px; }
  .shift-bar { background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; margin-bottom: 8px; }
  .shift-bar.warn { background: #fef3c7; border-color: #fcd34d; }
  .shift-bar .row { gap: 6px; margin-top: 6px; }
  .shift-bar input { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
  .variance-ok { color: #15803d; font-weight: 700; }
  .variance-bad { color: #b91c1c; font-weight: 700; }
  .tip { background: var(--green-soft); border: 1px solid #bfe3d0; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; margin-bottom: 8px; }
  .tip b { color: var(--green-dark); }
  .tip button { float: right; border: none; background: none; cursor: pointer; color: var(--muted); font-size: 14px; }
  #sell-btn { padding: 14px; font-size: 16px; }
  .held { font-size: 13px; }
  .held .r { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .login-wrap { display: flex; justify-content: center; padding-top: 40px; }
  .login-card { width: 360px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(16, 30, 22, .55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 12px; padding: 20px; width: 420px; max-width: 92vw; max-height: 88vh; overflow-y: auto; }
  .modal h3 { margin-top: 0; }
  .vrow { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  .vrow:hover { border-color: var(--green); background: var(--green-soft); }
  #receipt-overlay { position: fixed; inset: 0; background: rgba(16, 30, 22, .55); display: flex; align-items: center; justify-content: center; z-index: 60; }
  #receipt-box { background: #fff; width: 360px; max-height: 90vh; overflow-y: auto; border-radius: 10px; padding: 18px; }
  #receipt { font-family: "Courier New", monospace; font-size: 13px; }
  #receipt .ctr { text-align: center; }
  #receipt hr { border: none; border-top: 1px dashed #999; margin: 8px 0; }
  #receipt .rline { display: flex; justify-content: space-between; gap: 8px; }
  @media print {
    body * { visibility: hidden; }
    #receipt, #receipt * { visibility: visible; }
    #receipt { position: absolute; left: 0; top: 0; width: 72mm; }
    #receipt-overlay { position: static; background: none; }
  }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">OpenPOS v2 — <span data-i18n="till">Till</span></span>
  <span class="biz" id="p-ctx"></span>
  <span class="spacer"></span>
  <span class="net" id="p-net"></span>
  <button id="p-lang">SW</button>
  <a href="/" class="small" style="color:#fff" data-i18n="back">← Back</a>
  <button id="p-logout" data-i18n="logout">Sign out</button>
</div>

<!-- ================= LOGIN ================= -->
<div class="login-wrap" id="p-login">
  <div class="card login-card">
    <div class="tag" id="p-biz" style="color:var(--muted);font-size:13px;margin-bottom:8px"></div>
    <h3 data-i18n="staff_signin">Staff sign in</h3>
    <label class="f"><span data-i18n="select_staff">Select staff member</span>
      <select id="p-staff"></select></label>
    <div id="p-pinpad"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="p-go" data-i18n="sign_in">Sign in</button>
      <div class="msg" id="p-lmsg" style="margin:0"></div></div>
  </div>
</div>

<!-- ================= MAIN ================= -->
<div class="pos-body hidden" id="p-main">
  <div class="pos-left">
    <div id="scanbar"><span class="ic">⌕</span>
      <input id="scan" autocomplete="off" data-i18n-ph="scan_search" placeholder="Scan barcode or search…">
    </div>
    <div id="cats"></div>
    <div id="grid"></div>
  </div>
  <div class="pos-right">
    <div class="tip hidden" id="p-tip"><button id="p-tip-x">✕</button><span data-i18n="till_tip"></span></div>
    <div class="shift-bar hidden" id="p-shift"></div>
    <div class="cust-row">
      <select id="p-cust" style="flex:1"></select>
      <input id="p-promo" placeholder="Promo" style="width:90px" title="Promo code">
    </div>
    <div id="cart"></div>
    <div class="tots">
      <div class="r"><span data-i18n="subtotal">Subtotal</span><span id="t-sub">Ksh 0</span></div>
      <div class="r"><span data-i18n="discount">Discount</span><span id="t-disc">Ksh 0</span></div>
      <div class="r"><span data-i18n="vat">VAT</span><span id="t-tax">Ksh 0</span></div>
      <div class="r big"><span data-i18n="total">Total</span><span id="t-total">Ksh 0</span></div>
    </div>
    <div class="paytabs" id="p-tabs"></div>
    <div id="p-payfields">
      <label class="f" id="pf-cash"><span data-i18n="tender">Tender</span><input id="p-amount" type="number" min="0" placeholder="0"></label>
      <div class="quick" id="p-quick"></div>
      <label class="f hidden" id="pf-phone"><span data-i18n="phone">Phone</span><input id="p-phone" placeholder="07XX XXX XXX"></label>
      <label class="f hidden" id="pf-ref"><span data-i18n="payment_ref">Reference</span><input id="p-ref" placeholder="M-Pesa / card ref"></label>
    </div>
    <div class="act-row">
      <button class="btn ghost" id="p-hold" data-i18n="hold_sale">Hold</button>
      <button class="btn ghost" id="p-quote" data-i18n="quote_sale">Quote</button>
      <button class="btn" id="sell-btn" data-i18n="complete_sale">Complete sale</button>
    </div>
    <div class="msg" id="p-msg" style="margin:4px 0 0"></div>
    <div class="held" id="p-held"></div>
  </div>
</div>

<!-- ================= MODALS ================= -->
<div class="modal-bg hidden" id="m-variants"><div class="modal">
  <h3 id="mv-title"></h3>
  <div id="mv-rows"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-i18n="cancel" onclick="document.getElementById('m-variants').classList.add('hidden')">Cancel</button></div>
</div></div>

<div class="modal-bg hidden" id="m-age"><div class="modal">
  <h3 data-i18n="age_confirm_title">Age check</h3>
  <p id="ma-text"></p>
  <div class="row" style="justify-content:flex-end">
    <button class="btn ghost" id="ma-no" data-i18n="cancel">Cancel</button>
    <button class="btn" id="ma-yes" data-i18n="confirm_age">Customer is of age</button>
  </div>
</div></div>

<div class="modal-bg hidden" id="m-pin"><div class="modal">
  <h3 data-i18n="supervisor_pin">Supervisor PIN</h3>
  <p id="mp-text" data-i18n="supervisor_pin_msg">Enter a manager or owner PIN to approve this discount.</p>
  <div id="mp-pad"></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px">
    <button class="btn ghost" id="mp-cancel" data-i18n="cancel">Cancel</button>
    <button class="btn" id="mp-ok" data-i18n="confirm">Confirm</button>
  </div>
</div></div>

<div id="receipt-overlay" class="hidden"><div id="receipt-box">
  <div id="receipt"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn" id="rc-print" data-i18n="print">Print</button>
    <button class="btn ghost" id="rc-new" data-i18n="new_sale">New sale</button>
  </div>
</div></div>

<script src="/assets/app.js"></script>
<script>
const { t, setLang, api, fmt, esc, pinpad, toast, netBadge } = OP;
const $ = (s) => document.querySelector(s);

let ME = null, CTX = { branchId: null, register: null, registerName: '' };
let PRODUCTS = [], CATEGORIES = [], CUSTOMERS = [], VAT_RATE = 16;
let CART = [];            // {variant_id, product_id, name, sub, qty, unit_price, tax_type, age_min, line_discount, line_note, age_verified}
let PAY_METHOD = 'cash';
let PAY_METHODS = [{ key: 'cash', label: 'Cash', sw: 'Taslimu', async: false, ref: false, needsCustomer: false }];
let MPESA_CFG = { mode: 'manual', shortcode: '', paybill: '', phone: '' };
let SHIFT = null, SHIFT_ENFORCED = false, SHIFT_RESULT = null;
let PENDING_ADD = null;   // add waiting on age confirm
let PIN_CB = null;        // supervisor PIN callback
let RESUME_SALE = null;   // held sale being paid {id, gross}

// ---------------- boot ----------------
(async function boot() {
  netBadge($('#p-net'));
  $('#p-lang').onclick = () => {
    setLang(OP.lang() === 'en' ? 'sw' : 'en');
    $('#p-lang').textContent = OP.lang() === 'en' ? 'SW' : 'EN';
    applyI18n();
    drawPayTabs();
    if (!ME) { initLogin(); return; }
    drawCats(); drawGrid($('#cats .on') ? $('#cats .on').dataset.c : ''); drawCust(); drawCart(); loadHeld();
  };
  $('#p-logout').onclick = async () => { try { await api('/api/logout', { method: 'POST', noRedirect: true }); } catch {} location.reload(); };
  try {
    ME = (await api('/api/me', { noRedirect: true })).user;
  } catch { initLogin(); return; }
  await initMain();
})();

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
}

// ---------------- login ----------------
function initLogin() {
  $('#p-main').classList.add('hidden');
  $('#p-login').classList.remove('hidden');
  api('/api/setup/status').then((s) => { $('#p-biz').textContent = s.businessName || ''; }).catch(() => {});
  api('/api/staff/public').then((rows) => {
    $('#p-staff').innerHTML = rows.map((u) =>
      `<option value="${esc(u.name)}">${esc(u.name)} · ${esc(t(u.role === 'staff' ? 'staff_r' : u.role))}</option>`).join('');
    if (rows.length === 1) $('#p-staff').disabled = true;
  }).catch(() => {});
  let pin = '';
  pinpad($('#p-pinpad'), (p) => { pin = p; });
  $('#p-go').onclick = async () => {
    const msg = $('#p-lmsg');
    try {
      const r = await api('/api/login', { method: 'POST', body: { name: $('#p-staff').value, pin } });
      ME = r.user;
      await initMain();
    } catch (e) {
      toast(msg, /locked|attempts/.test(e.message) ? t('locked') : e.message, false);
    }
  };
  applyI18n();
}

async function initMain() {
  $('#p-login').classList.add('hidden');
  $('#p-main').classList.remove('hidden');
  CTX.branchId = ME.branchId;
  const regs = await api('/api/registers').catch(() => []);
  CTX.register = regs.find((r) => r.id === ME.registerId) || regs[0] || null;
  CTX.registerName = CTX.register ? `${CTX.register.name} · ${CTX.register.locationName}` : '';
  $('#p-ctx').textContent = CTX.registerName || ME.name;
  const [prods, cats, custs, boot] = await Promise.all([
    api('/api/products').catch(() => []),
    api('/api/categories').catch(() => []),
    api('/api/customers').catch(() => []),
    api('/api/bootstrap').catch(() => ({}))
  ]);
  PRODUCTS = prods; CATEGORIES = cats; CUSTOMERS = custs;
  VAT_RATE = Number((boot.settings && boot.settings.tax && boot.settings.tax.vatRate) || 16);
  drawCats(); drawGrid(); drawCust(); drawCart(); loadHeld();
  applyI18n();
  wireCart();
  loadPayMethods();
  if (ME.role === 'cashier' || ME.role === 'staff') loadShift();
  if (!localStorage.getItem('op_till_tip_v1')) $('#p-tip').classList.remove('hidden');
  setTimeout(() => $('#scan').focus(), 50);
}

// ---------------- grid ----------------
function drawCats(current) {
  const el = $('#cats');
  const cur = current !== undefined ? current : (el.querySelector('.on') ? el.querySelector('.on').dataset.c : '');
  el.innerHTML = `<button data-c="" class="${cur === '' ? 'on' : ''}">${t('all')}</button>` + CATEGORIES
    .map((c) => `<button data-c="${c.id}" class="${String(c.id) === String(cur) ? 'on' : ''}">${esc(c.name)}</button>`).join('');
  el.querySelectorAll('button').forEach((b) => { b.onclick = () => { el.querySelectorAll('button').forEach((x) => x.classList.remove('on')); b.classList.add('on'); drawGrid(b.dataset.c); }; });
}

function drawGrid(catId) {
  const q = ($('#scan').value || '').toLowerCase();
  const rows = PRODUCTS.filter((p) => (!catId || p.category_id === Number(catId)) &&
    (!q || p.name.toLowerCase().includes(q) || (p.barcode || '').includes(q)));
  $('#grid').innerHTML = rows.map((p) => {
    const low = p.stock_qty <= 0;
    return `<button class="prod" data-id="${p.id}">
      <div class="nm">${esc(p.name)}${p.age_min ? ` <span class="pill r">${p.age_min}+</span>` : ''}${p.requires_rx ? ' <span class="pill">Rx</span>' : ''}</div>
      <div class="pr">${fmt(p.price)}</div>
      <div class="st ${low ? 'low' : ''}">${low ? t('out_of_stock') : `${p.stock_qty} ${esc(p.unit || '')}`}</div>
    </button>`;
  }).join('') || `<div class="muted" style="grid-column:1/-1;padding:20px">${t('no_rows')}</div>`;
  $('#grid').querySelectorAll('.prod').forEach((b) => { b.onclick = () => productClick(Number(b.dataset.id)); });
}

async function productClick(productId) {
  const p = PRODUCTS.find((x) => x.id === productId);
  if (!p) return;
  if (p.variant_count > 1) return openVariantPicker(p);
  if (!p.base_variant_id) return toast($('#p-msg'), t('no_rows'), false);
  const v = { id: p.base_variant_id, name: '' };
  await addVariantLine(p, v);
}

async function openVariantPicker(p) {
  const vs = await api(`/api/products/${p.id}/variants`).catch(() => []);
  $('#mv-title').textContent = p.name;
  $('#mv-rows').innerHTML = vs.map((v) => {
    const label = v.name || Object.entries(v.axes || {}).map(([k, x]) => `${k}: ${x}`).join(' · ') || '—';
    return `<div class="vrow" data-id="${v.id}"><div><div style="font-weight:600">${esc(label)}</div>
      <div class="muted small">${fmt(v.price)}</div></div><span class="pill">+</span></div>`;
  }).join('');
  $('#m-variants').classList.remove('hidden');
  $('#mv-rows').querySelectorAll('.vrow').forEach((r) => {
    r.onclick = async () => {
      $('#m-variants').classList.add('hidden');
      const v = vs.find((x) => x.id === Number(r.dataset.id));
      await addVariantLine(p, v);
    };
  });
}

async function addVariantLine(p, v) {
  // R-PR: freeze the price the moment the line is added (server-side chain).
  let unitPrice = p.price, taxType = p.tax_type || 'std';
  try {
    const r = await api(`/api/pricing/resolve?variant_id=${v.id}&branch_id=${CTX.branchId || ''}${CUST_ID() ? `&customer_id=${CUST_ID()}` : ''}${PROMO() ? `&promo_code=${encodeURIComponent(PROMO())}` : ''}`);
    unitPrice = r.price; taxType = p.tax_type || 'std';
  } catch { /* offline-ish: fall back to list price */ }
  if (p.age_min) {
    const okAge = await ageConfirm(p);
    if (!okAge) return;
  }
  const ex = CART.find((l) => l.variant_id === v.id && l.line_discount === 0);
  if (ex) ex.qty += 1;
  else CART.push({
    variant_id: v.id, product_id: p.id,
    name: p.name + (v.name ? ` — ${v.name}` : ''),
    qty: 1, unit_price: unitPrice, tax_type: taxType,
    age_min: p.age_min || 0, age_verified: p.age_min ? 1 : 0,
    line_discount: 0, line_note: ''
  });
  drawCart();
  $('#scan').focus();
}

function ageConfirm(p) {
  return new Promise((resolve) => {
    $('#ma-text').textContent = `${p.name} — ${t('age_confirm_msg').replace('{n}', p.age_min)}`;
    const bg = $('#m-age');
    bg.classList.remove('hidden');
    const done = (v) => { bg.classList.add('hidden'); $('#ma-yes').onclick = null; $('#ma-no').onclick = null; resolve(v); };
    $('#ma-yes').onclick = () => done(true);
    $('#ma-no').onclick = () => done(false);
  });
}

// ---------------- cart ----------------
function CUST_ID() { return Number($('#p-cust').value) || null; }
function PROMO() { return $('#p-promo').value.trim(); }

function drawCust() {
  $('#p-cust').innerHTML = `<option value="">${t('walk_in')}</option>` + CUSTOMERS
    .map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#p-cust').onchange = () => { reprice(); drawCart(); };
  $('#p-promo').onchange = () => { reprice(); drawCart(); };
}

async function reprice() {
  for (const L of CART) {
    const p = PRODUCTS.find((x) => x.id === L.product_id);
    if (!p) continue;
    try {
      const r = await api(`/api/pricing/resolve?variant_id=${L.variant_id}&branch_id=${CTX.branchId || ''}${CUST_ID() ? `&customer_id=${CUST_ID()}` : ''}${PROMO() ? `&promo_code=${encodeURIComponent(PROMO())}` : ''}`);
      L.unit_price = r.price;
    } catch { /* keep frozen price */ }
  }
}

function wireCart() {
  $('#scan').oninput = () => drawGrid($('#cats .on') ? $('#cats .on').dataset.c : '');
  $('#scan').onkeydown = (e) => { if (e.key === 'Enter') { scan($('#scan').value.trim()); } };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F2') { e.preventDefault(); $('#scan').focus(); }
  });
  drawPayTabs();
  $('#p-amount').oninput = drawQuick;
  $('#sell-btn').onclick = () => completeSale();
  $('#p-hold').onclick = () => holdSale('sale');
  $('#p-quote').onclick = () => holdSale('quote');
  $('#p-tip-x').onclick = () => { $('#p-tip').classList.add('hidden'); localStorage.setItem('op_till_tip_v1', '1'); };
}

function scan(code) {
  if (!code) return;
  api(`/api/scan/${encodeURIComponent(code)}`).then((r) => {
    const p = PRODUCTS.find((x) => x.id === r.product.id) || r.product;
    const v = { id: r.variant.id, name: r.variant.name };
    return addVariantLine(p, v);
  }).catch((e) => {
    // Not a barcode → treat as search
    $('#scan').value = code;
    drawGrid($('#cats .on') ? $('#cats .on').dataset.c : '');
    toast($('#p-msg'), e.message, false);
  }).finally(() => { $('#scan').value = ''; drawGrid($('#cats .on') ? $('#cats .on').dataset.c : ''); $('#scan').focus(); });
}

function lineGross(L) { return Math.round(L.unit_price * L.qty) - (L.line_discount || 0); }
function lineTax(L) { return L.tax_type === 'std' ? Math.round(lineGross(L) * VAT_RATE / (100 + VAT_RATE)) : 0; }

function drawCart() {
  const el = $('#cart');
  if (RESUME_SALE) {
    const isQuote = RESUME_SALE.kind === 'quote';
    el.innerHTML = `<div class="cline"><div><div class="nm">${isQuote ? t('quote_sale') : t('held_sale')} #${RESUME_SALE.id}</div>
      <div class="sub">${t('total')}: ${fmt(RESUME_SALE.gross)}</div></div></div>`;
    $('#sell-btn').textContent = isQuote ? t('convert_sale') : t('resume_sale');
    $('#p-hold').disabled = true;
    $('#p-quote').disabled = true;
  } else {
    $('#sell-btn').textContent = t('complete_sale');
    $('#p-hold').disabled = !CART.length;
    $('#p-quote').disabled = !CART.length;
    el.innerHTML = CART.map((L, i) => `
      <div class="cline">
        <div>
          <div class="nm">${esc(L.name)}${L.line_discount ? ` <span class="pill r">−${fmt(L.line_discount)}</span>` : ''}${L.line_note ? ' <span class="pill">📝</span>' : ''}</div>
          <div class="sub">${fmt(L.unit_price)} × ${L.qty}</div>
        </div>
        <div class="qty">
          <button data-a="dec" data-i="${i}">−</button>
          <input type="number" min="0" step="0.5" value="${L.qty}" data-q="${i}">
          <button data-a="inc" data-i="${i}">+</button>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <div class="tot">${fmt(lineGross(L) + lineTax(L))}</div>
          <div class="row" style="gap:4px">
            <button class="btn small ghost" data-a="disc" data-i="${i}" title="${t('discount')}">${t('discount')}</button>
            <button class="btn small ghost" data-a="note" data-i="${i}" title="${t('note')}">📝</button>
            <button class="btn small danger" data-a="del" data-i="${i}">✕</button>
          </div>
        </div>
      </div>`).join('') || `<div class="muted" style="padding:14px;text-align:center">${t('cart_empty')}</div>`;
  }
  // totals
  let sub = 0, disc = 0, tax = 0, gross = 0;
  for (const L of CART) { sub += Math.round(L.unit_price * L.qty); disc += L.line_discount || 0; tax += lineTax(L); }
  gross = sub - disc + tax;
  if (RESUME_SALE) { sub = RESUME_SALE.gross; disc = 0; tax = 0; gross = RESUME_SALE.gross; }
  $('#t-sub').textContent = fmt(sub);
  $('#t-disc').textContent = disc ? '−' + fmt(disc) : fmt(0);
  $('#t-tax').textContent = fmt(tax);
  $('#t-total').textContent = fmt(gross);
  drawQuick();

  el.querySelectorAll('[data-a]').forEach((b) => {
    const i = Number(b.dataset.i);
    b.onclick = () => {
      if (RESUME_SALE) return;
      const L = CART[i];
      if (b.dataset.a === 'inc') L.qty += 1;
      else if (b.dataset.a === 'dec') { L.qty = Math.max(0.5, L.qty - 1); if (L.qty <= 0) CART.splice(i, 1); }
      else if (b.dataset.a === 'del') CART.splice(i, 1);
      else if (b.dataset.a === 'disc') return promptDiscount(L);
      else if (b.dataset.a === 'note') {
        const n = prompt(t('note'), L.line_note || '');
        if (n !== null) { L.line_note = n.trim(); }
        drawCart(); return;
      }
      drawCart();
    };
  });
  el.querySelectorAll('[data-q]').forEach((inp) => {
    inp.onchange = () => {
      if (RESUME_SALE) return;
      const L = CART[Number(inp.dataset.q)];
      const q = Number(inp.value);
      if (Number.isFinite(q) && q > 0) L.qty = q; else CART.splice(Number(inp.dataset.q), 1);
      drawCart();
    };
  });
}

function drawQuick() {
  const gross = Number($('#t-total').dataset.v || 0);
  const total = RESUME_SALE ? RESUME_SALE.gross : cartTotal();
  $('#t-total').dataset.v = total;
  if (PAY_METHOD !== 'cash') { $('#p-quick').innerHTML = ''; if (PAY_METHOD !== 'mpesa') $('#p-amount').value = total; else $('#p-amount').value = total; return; }
  $('#p-quick').innerHTML = [
    [t('exact'), total],
    [Math.ceil(total / 100) * 100, null],
    [Math.ceil(total / 500) * 500, null],
    [Math.ceil(total / 1000) * 1000, null]
  ].map(([label, v], i) => `<button data-v="${v}">${i === 0 ? label : fmt(v)}</button>`).join('');
  $('#p-quick').querySelectorAll('button').forEach((b) => { b.onclick = () => { $('#p-amount').value = b.dataset.v; drawCart(); }; });
}

function cartTotal() {
  let s = 0; for (const L of CART) s += lineGross(L) + lineTax(L);
  return s;
}

function promptDiscount(L) {
  const val = prompt(`${t('discount')} — ${L.name} (${fmt(lineGross(L) + lineTax(L))})`, L.line_discount || '');
  if (val === null) return;
  const d = Math.max(0, Math.round(Number(val) || 0));
  L.line_discount = d;
  drawCart();
}

// ---------------- supervisor PIN ----------------
function askSupervisorPin() {
  return new Promise((resolve) => {
    let pin = '';
    pinpad($('#mp-pad'), (p) => { pin = p; });
    const bg = $('#m-pin');
    bg.classList.remove('hidden');
    const done = (v) => { bg.classList.add('hidden'); $('#mp-ok').onclick = null; $('#mp-cancel').onclick = null; resolve(v || null); };
    $('#mp-ok').onclick = () => done(pin);
    $('#mp-cancel').onclick = () => done(null);
  });
}

// ---------------- checkout ----------------
async function completeSale() {
  const msg = $('#p-msg');
  if (RESUME_SALE) return resumeSale();
  if (!CART.length) return toast(msg, t('cart_empty'), false);
  const total = cartTotal();
  const body = {
    items: CART.map((L) => ({
      variant_id: L.variant_id, qty: L.qty, line_discount: L.line_discount || 0,
      line_note: L.line_note || '', age_verified: L.age_verified ? 1 : 0
    })),
    customer_id: CUST_ID(),
    note: '',
    promo_code: PROMO() || null,
    payment: payBody(total)
  };
  try {
    const r = await api('/api/sales', { method: 'POST', body });
    showReceipt(r);
  } catch (e) {
    if (/PIN|discount/i.test(e.message)) {
      const pin = await askSupervisorPin();
      if (pin) {
        try {
          const r = await api('/api/sales', { method: 'POST', body: { ...body, override_pin: pin } });
          showReceipt(r); return;
        } catch (e2) { toast(msg, e2.message, false); }
      }
    } else toast(msg, e.message, false);
  }
}

// What the till shows is whatever the business has enabled — the engine
// (and only the engine) knows what a M-Pesa or a card actually is.
async function loadPayMethods() {
  try {
    const r = await api('/api/payments/methods');
    if (r.methods && r.methods.length) PAY_METHODS = r.methods;
    if (r.mpesa) MPESA_CFG = r.mpesa;
  } catch { /* offline: keep last list */ }
  drawPayTabs();
}

function methodLabel(m) { return OP.lang() === 'sw' ? (m.sw || m.label) : m.label; }

function drawPayTabs() {
  if (!$('#p-tabs')) return;
  if (!PAY_METHODS.some((m) => m.key === PAY_METHOD)) PAY_METHOD = PAY_METHODS[0].key;
  $('#p-tabs').innerHTML = PAY_METHODS.map((m) =>
    `<button data-m="${m.key}" class="${m.key === PAY_METHOD ? 'on' : ''}">${esc(methodLabel(m))}</button>`).join('');
  $('#p-tabs').querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      PAY_METHOD = b.dataset.m;
      const m = PAY_METHODS.find((x) => x.key === PAY_METHOD) || {};
      $('#pf-cash').classList.toggle('hidden', PAY_METHOD !== 'cash');
      $('#pf-phone').classList.toggle('hidden', PAY_METHOD !== 'mpesa');
      $('#pf-ref').classList.toggle('hidden', !(m.ref && PAY_METHOD !== 'mpesa'));
      $('#p-ref').placeholder = m.ref ? 'terminal slip / transfer ref' : '';
      drawPayTabs(); drawCart();
    };
  });
}

function payBody(total) {
  const m = PAY_METHODS.find((x) => x.key === PAY_METHOD) || {};
  const b = { method: PAY_METHOD };
  if (PAY_METHOD === 'cash') b.amount = Math.round(Number($('#p-amount').value) || total);
  else b.amount = total;
  if (PAY_METHOD === 'mpesa') b.phone = $('#p-phone').value.trim();
  if (m.ref && PAY_METHOD !== 'mpesa') b.ref = $('#p-ref').value.trim();
  return b;
}

async function holdSale(kind) {
  if (!CART.length) return;
  const msg = $('#p-msg');
  const body = {
    items: CART.map((L) => ({ variant_id: L.variant_id, qty: L.qty, line_discount: L.line_discount || 0, line_note: L.line_note || '', age_verified: L.age_verified ? 1 : 0 })),
    customer_id: CUST_ID(), promo_code: PROMO() || null, hold: true
  };
  if (kind === 'quote') body.kind = 'quote';
  try {
    const r = await api('/api/sales', { method: 'POST', body });
    toast(msg, `${kind === 'quote' ? t('quote_sale') : t('held_sale')} #${r.sale.id}`, true);
    CART = []; CUST_ID(); $('#p-promo').value = '';
    drawCart(); loadHeld(); $('#scan').focus();
  } catch (e) { toast(msg, e.message, false); }
}

async function loadHeld() {
  try {
    const rows = await api('/api/sales?status=suspended&mine=1&limit=10');
    $('#p-held').innerHTML = rows.length
      ? `<div class="muted small" style="margin-top:8px">${t('held_sales')}</div>` + rows.map((s) => {
          const isQuote = s.kind === 'quote';
          return `<div class="r"><span>#${s.id} · ${isQuote ? `<span class="pill">${t('quote_sale')}</span> ` : ''}${fmt(s.gross)} · ${esc(s.cashier || '')}</span>
           <button class="btn small" data-resume="${s.id}" data-g="${s.gross}" data-kind="${isQuote ? 'quote' : 'sale'}">${isQuote ? t('convert_sale') : t('resume')}</button></div>`;
        }).join('')
      : '';
    $('#p-held').querySelectorAll('[data-resume]').forEach((b) => {
      b.onclick = () => {
        RESUME_SALE = { id: Number(b.dataset.resume), gross: Number(b.dataset.g), kind: b.dataset.kind };
        drawCart();
      };
    });
  } catch { /* not critical */ }
}

async function resumeSale() {
  const msg = $('#p-msg');
  const total = RESUME_SALE.gross;
  const b = payBody(total);
  const action = RESUME_SALE.kind === 'quote' ? 'convert' : 'pay';
  try {
    const r = await api(`/api/sales/${RESUME_SALE.id}/${action}`, { method: 'POST', body: { payment: b } });
    RESUME_SALE = null;
    showReceipt(r);
    loadHeld();
  } catch (e) { toast(msg, e.message, false); }
}

// ---------------- receipt ----------------
function showReceipt(data) {
  const s = data.sale, rc = data.receipt;
  const sym = rc.symbol || 'Ksh';
  const f = (n) => `${sym} ${Number(n || 0).toLocaleString('en-KE')}`;
  const itemLines = data.items.map((it) =>
    `<div class="rline"><span>${esc(it.name)} × ${it.qty}${it.line_discount ? ` (−${f(it.line_discount)})` : ''}</span><span>${f(it.gross)}</span></div>`).join('');
  const payLines = data.payments.map((p) => `<div class="rline"><span>${esc(p.method)}${p.ref ? ` · ${esc(p.ref)}` : ''}${p.status !== 'confirmed' ? ` <span class="pill">${t(p.status)}</span>` : ''}</span><span>${f(p.amount)}</span></div>`).join('');
  // Payment follow-up: money still coming (pending) or a balance left (split).
  const confirmedSum = data.payments.filter((p) => p.status === 'confirmed').reduce((a, p) => a + Number(p.amount), 0);
  const pendingPay = data.payments.find((p) => p.status === 'pending');
  const balance = Math.max(0, s.gross - confirmedSum);
  let followup = '';
  if (pendingPay) {
    const ml = PAY_METHODS.find((m) => m.key === pendingPay.method);
    const note = (pendingPay.method === 'mpesa' && data.mpesa && data.mpesa.instructions)
      ? esc(data.mpesa.instructions)
      : (pendingPay.method === 'mpesa' && data.mpesa && data.mpesa.mode === 'sandbox')
        ? t('sandbox_wait')
        : t('awaiting_generic');
    followup = `<div class="followup">
      <div class="r"><b>${t('awaiting_payment')}</b><span class="pill">${esc(ml ? methodLabel(ml) : pendingPay.method)}</span></div>
      <div class="muted small" style="margin:4px 0">${note}</div>
      <div class="row">
        <input id="async-code" placeholder="${t('confirm_code')}" style="flex:1">
        <button class="btn small" id="async-confirm">${t('confirm_payment')}</button>
        <button class="btn ghost small" id="async-cancel">${t('cancel_payment')}</button>
        ${data.mpesa && data.mpesa.mode === 'sandbox' ? `<button class="btn ghost small" id="async-sim">${t('simulate_callback')}</button>` : ''}
      </div>
    </div>`;
  } else if (balance > 0) {
    followup = `<div class="followup">
      <div class="r"><span>${t('balance')}</span><b>${f(balance)}</b></div>
      <div class="row" style="margin-top:6px">
        <select id="more-method" style="flex:1">${PAY_METHODS.map((m) => `<option value="${m.key}">${esc(methodLabel(m))}</option>`).join('')}</select>
        <input id="more-amount" type="number" min="1" placeholder="${f(balance)}" style="width:110px">
        <input id="more-ref" placeholder="${t('payment_ref')}" class="hidden" style="width:120px">
        <input id="more-phone" placeholder="${t('phone')}" class="hidden" style="width:120px">
      </div>
      <div class="row" style="margin-top:6px"><button class="btn" id="more-pay">${t('add_payment')}</button></div>
    </div>`;
  }
  let changeLine = '';
  const tendered = data.payments.reduce((a, p) => a + (JSON.parse(p.raw || '{}').tendered || 0), 0);
  if (tendered > s.gross) changeLine = `<div class="rline"><b>${t('change')}</b><span><b>${f(tendered - s.gross)}</b></span></div>`;
  $('#receipt').innerHTML = `
    <div class="ctr"><b style="font-size:15px">${esc(rc.business.name || 'OpenPOS')}</b><br>
    ${esc(rc.business.phone || '')}${rc.business.kraPin ? `<br>PIN: ${esc(rc.business.kraPin)}` : ''}${rc.business.address ? `<br>${esc(rc.business.address)}` : ''}</div>
    <hr>
    <div class="rline"><span>${t('invoice_no') || 'Invoice'}</span><span>${esc(s.invoice_no)}</span></div>
    <div class="rline"><span>${new Date(s.created_at).toLocaleString()}</span><span>${esc(s.status)}</span></div>
    <div class="rline"><span>${esc(s.cashier || '')}</span><span>${CTX.registerName ? esc(CTX.registerName) : ''}</span></div>
    ${data.customer ? `<div class="rline"><span>${t('customer') || 'Customer'}</span><span>${esc(data.customer.name)}</span></div>` : ''}
    <hr>
    ${itemLines}
    <hr>
    <div class="rline"><span>${t('subtotal')}</span><span>${f(s.subtotal)}</span></div>
    ${s.discount ? `<div class="rline"><span>${t('discount')}</span><span>−${f(s.discount)}</span></div>` : ''}
    ${s.tax ? `<div class="rline"><span>VAT ${rc.vatRate || 16}%</span><span>${f(s.tax)}</span></div>` : ''}
    <div class="rline"><b>${t('total')}</b><span><b>${f(s.gross)}</b></span></div>
    <hr>
    ${payLines}
    ${changeLine}
    ${followup}
    <hr>
    <div class="ctr">${esc(rc.footer || 'Asante!')}<br><span style="font-size:11px">OpenPOS v2 · eTIMS: ${esc(s.etims_status)}</span></div>`;
  $('#receipt-overlay').classList.remove('hidden');
  // reset cart
  CART = []; RESUME_SALE = null; $('#p-promo').value = '';
  if (CUST_ID()) $('#p-cust').value = '';
  drawCart(); $('#p-amount').value = '';
  wireFollowup(data, pendingPay, balance);
  if (ME && (ME.role === 'cashier' || ME.role === 'staff')) loadShift();
  $('#scan').focus();
}

// ---------------- shift & till control ----------------
async function loadShift() {
  try {
    const r = await api('/api/shifts/mine');
    SHIFT = r.shift; SHIFT_ENFORCED = !!r.enforced;
  } catch { SHIFT = null; }
  drawShift();
}

function drawShift() {
  const el = $('#p-shift');
  if (!$('#p-shift')) return;
  const f = (n) => `${OP.sym || 'Ksh'} ${Number(n || 0).toLocaleString('en-KE')}`;
  const sellBtn = $('#sell-btn');
  if (!SHIFT) {
    const enforced = SHIFT_ENFORCED && (ME.role === 'cashier');
    el.classList.remove('hidden');
    el.classList.toggle('warn', enforced);
    el.innerHTML = `<div class="r"><b>${t('no_shift_open')}</b><span>${enforced ? t('till_enforced') : t('shift_hint')}</span></div>
      <div class="row"><button class="btn small" id="sh-open">${t('open_shift')}</button>
      <span class="hidden" id="sh-float-wrap"><input id="sh-float" type="number" min="0" placeholder="${t('float')} (0 ok)" style="width:130px"><button class="btn small" id="sh-float-go">${t('confirm')}</button></span></div>`;
    el.querySelector('#sh-open').onclick = () => { el.querySelector('#sh-float-wrap').classList.remove('hidden'); el.querySelector('#sh-float').focus(); };
    el.querySelector('#sh-float-go').onclick = async () => {
      try {
        await api('/api/shifts', { method: 'POST', body: { float_open: Number($('#sh-float').value) || 0 } });
        SHIFT_RESULT = null; await loadShift();
      } catch (e) { toast($('#p-msg'), e.message, false); }
    };
    if (enforced && sellBtn) sellBtn.disabled = true;
    return;
  }
  if (sellBtn) sellBtn.disabled = false;
  el.classList.remove('hidden', 'warn');
  let body;
  if (SHIFT.status === 'open') {
    body = `<div class="r"><b>${t('shift_open')}: #${SHIFT.id}</b><span>${esc(SHIFT.register_name || '')} · ${t('float')} ${f(SHIFT.float_open)} · ${t('drawer')}: <b>${f(SHIFT.float_open + SHIFT.cash_in - SHIFT.cash_refunded - SHIFT.payouts - SHIFT.deposits)}</b></span></div>
      <div class="row"><span class="muted small">${t('expected')}: ${f(SHIFT.expected_cash)}</span>
      <span class="spacer"></span>
      <button class="btn ghost small" id="sh-payout">${t('payout')}</button>
      <button class="btn small" id="sh-close">${t('close_shift')}</button></div>
      <div class="hidden" id="sh-payout-wrap" style="margin-top:6px"><input id="sh-payout-amt" type="number" min="1" placeholder="amount" style="width:100px"> <input id="sh-payout-reason" placeholder="${t('reason')}" style="flex:1"> <button class="btn small" id="sh-payout-go">${t('add')}</button></div>
      <div class="hidden" id="sh-close-wrap" style="margin-top:6px"><input id="sh-counted" type="number" min="0" placeholder="${t('counted')}" style="width:120px"> <input id="sh-note" placeholder="${t('note')}" style="flex:1"> <button class="btn small" id="sh-close-go">${t('close_shift')}</button></div>`;
  } else {
    const v = SHIFT.variance || 0;
    body = `<div class="r"><b>${t('shift_closed')}: #${SHIFT.id}</b><span>${t('expected')} ${f(SHIFT.expected_cash)} · ${t('counted')} ${f(SHIFT.counted_cash)} · ${t('variance')}: <span class="${v === 0 ? 'variance-ok' : 'variance-bad'}">${v === 0 ? '0 ✓' : (v > 0 ? '+' : '') + f(v).replace('Ksh ', '')}</span></span></div>
      <div class="row"><button class="btn small" id="sh-new">${t('new_shift')}</button></div>`;
  }
  el.innerHTML = body;
  const po = el.querySelector('#sh-payout');
  if (po) {
    po.onclick = () => el.querySelector('#sh-payout-wrap').classList.toggle('hidden');
    el.querySelector('#sh-payout-go').onclick = async () => {
      try {
        await api(`/api/shifts/${SHIFT.id}/payouts`, { method: 'POST', body: { amount: Number($('#sh-payout-amt').value), reason: $('#sh-payout-reason').value.trim() } });
        await loadShift();
      } catch (e) { toast($('#p-msg'), e.message, false); }
    };
  }
  const cl = el.querySelector('#sh-close');
  if (cl) {
    cl.onclick = () => el.querySelector('#sh-close-wrap').classList.toggle('hidden');
    el.querySelector('#sh-close-go').onclick = async () => {
      try {
        const r = await api(`/api/shifts/${SHIFT.id}/close`, { method: 'POST', body: { counted_cash: Number($('#sh-counted').value) || 0, note: $('#sh-note').value.trim() } });
        SHIFT = r.shift; drawShift();
      } catch (e) { toast($('#p-msg'), e.message, false); }
    };
  }
  const nw = el.querySelector('#sh-new');
  if (nw) nw.onclick = async () => {
    try {
      await api('/api/shifts', { method: 'POST', body: { float_open: Number(prompt(t('float') + '?', '0')) || 0 } });
      await loadShift();
    } catch (e) { toast($('#p-msg'), e.message, false); }
  };
}

function wireFollowup(data, pendingPay, balance) {
  const msg = $('#p-msg');
  if (pendingPay) {
    const asyncCode = $('#async-code');
    $('#async-confirm').onclick = async () => {
      try {
        const r = await api(`/api/payments/${pendingPay.id}/confirm`, { method: 'POST', body: { code: asyncCode.value.trim() } });
        showReceipt(r);
      } catch (e) { toast(msg, e.message, false); }
    };
    $('#async-cancel').onclick = async () => {
      try {
        const r = await api(`/api/payments/${pendingPay.id}/cancel`, { method: 'POST', body: {} });
        showReceipt(r);
      } catch (e) { toast(msg, e.message, false); }
    };
    const sim = $('#async-sim');
    if (sim) sim.onclick = async () => {
      try {
        const r = await api(`/api/payments/${pendingPay.id}/simulate-callback`, { method: 'POST', body: {} });
        showReceipt(r);
      } catch (e) { toast(msg, e.message, false); }
    };
    asyncCode.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#async-confirm').click(); });
  }
  if ($('#more-pay')) {
    $('#more-method').onchange = () => {
      const key = $('#more-method').value;
      const m = PAY_METHODS.find((x) => x.key === key) || {};
      $('#more-ref').classList.toggle('hidden', !(m.ref && key !== 'mpesa'));
      $('#more-phone').classList.toggle('hidden', key !== 'mpesa');
    };
    $('#more-pay').onclick = async () => {
      const key = $('#more-method').value;
      const m = PAY_METHODS.find((x) => x.key === key) || {};
      const body = { method: key, amount: Math.round(Number($('#more-amount').value) || balance) };
      if (m.ref && key !== 'mpesa') body.ref = $('#more-ref').value.trim();
      if (key === 'mpesa') body.phone = $('#more-phone').value.trim();
      try {
        const r = await api(`/api/sales/${data.sale.id}/payments`, { method: 'POST', body });
        showReceipt(r);
      } catch (e) { toast(msg, e.message, false); }
    };
  }
}

$('#rc-print').onclick = () => window.print();
$('#rc-new').onclick = () => { $('#receipt-overlay').classList.add('hidden'); $('#scan').focus(); };
</script>
